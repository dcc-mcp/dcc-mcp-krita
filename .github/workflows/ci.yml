name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python-version: "3.9"}
          - {os: ubuntu-latest, python-version: "3.12"}
          - {os: windows-latest, python-version: "3.12"}
          - {os: macos-latest, python-version: "3.12"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python-version }}"}
      - run: python -m pip install -e ".[dev]"
      - name: Lifecycle round-trip smoke
        run: python -m pytest tests/test_install_lifecycle.py -q
      - run: python -m pytest -q
      - run: python -m ruff check src tests tools bridge
      - run: python -m ruff format --check src tests tools bridge
      - run: python tools/lint_skills.py
      - run: python -m py_compile bridge/krita-plugin/dcc_mcp_krita/__init__.py bridge/krita-plugin/dcc_mcp_krita/runtime.py
      - run: python -m build
      - if: matrix.python-version == '3.12'
        run: python -m twine check dist/*
