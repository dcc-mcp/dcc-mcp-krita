[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "dcc-mcp-krita"
version = "0.5.0"
description = "Typed document, layer, painting, and export automation for Krita"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "loonghao", email = "hal.long@outlook.com" }]
keywords = ["krita", "image-editing", "mcp", "dcc", "automation"]
dependencies = ["dcc-mcp-core>=0.19.38,<1.0.0"]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "ruff>=0.8", "tomli>=2; python_version < '3.11'", "twine>=7.0; python_version >= '3.10'"]

[project.urls]
Homepage = "https://github.com/dcc-mcp/dcc-mcp-krita"
Repository = "https://github.com/dcc-mcp/dcc-mcp-krita"
Issues = "https://github.com/dcc-mcp/dcc-mcp-krita/issues"

[project.scripts]
dcc-mcp-krita = "dcc_mcp_krita.cli:main"
dcc-mcp-krita-install = "dcc_mcp_krita.install:main"
dcc-mcp-krita-doctor = "dcc_mcp_krita.install:doctor_main"

[project.entry-points."dcc_mcp.adapters"]
krita = "dcc_mcp_krita:KritaMcpServer"

[tool.hatch.build.targets.wheel]
packages = ["src/dcc_mcp_krita"]
artifacts = ["src/dcc_mcp_krita/skills/**"]

[tool.hatch.build.targets.wheel.force-include]
"bridge/krita-plugin/dcc_mcp_krita.desktop" = "dcc_mcp_krita/krita_plugin/dcc_mcp_krita.desktop"
"bridge/krita-plugin/dcc_mcp_krita/__init__.py" = "dcc_mcp_krita/krita_plugin/dcc_mcp_krita/__init__.py"
"bridge/krita-plugin/dcc_mcp_krita/runtime.py" = "dcc_mcp_krita/krita_plugin/dcc_mcp_krita/runtime.py"

[tool.hatch.build.targets.sdist]
include = ["src/dcc_mcp_krita", "bridge", "docs", "tests", "README.md", "install.md", "LICENSE", "CHANGELOG.md", "tools"]
exclude = ["docs/**/*.png", "docs/**/*.svg", "docs/**/*.webp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
